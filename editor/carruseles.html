<style>
@font-face { font-family: "Bebas"; src: url("/fuentes/BebasNeue-Regular.ttf"); }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url("/fuentes/DMSans-Medium.ttf"); }
@font-face { font-family: "DM Sans"; font-weight: 700; src: url("/fuentes/DMSans-Bold.ttf"); }
@font-face { font-family: "DM Sans"; font-weight: 900; src: url("/fuentes/DMSans-Black.ttf"); }
@font-face { font-family: "Archivo Black"; src: url("/fuentes/ArchivoBlack-Regular.ttf"); }
@font-face { font-family: "Lilita"; src: url("/fuentes/LilitaOne-Regular.ttf"); }
@font-face { font-family: "Anton"; src: url("/fuentes/Anton-Regular.ttf"); }
:root {
  color-scheme: dark;
  --bg: #04060b; --bg2: #070b14; --surface: #0b111e; --surface2: #101829; --raise: #152038;
  --ink: #edf3ff; --muted: #8494b4; --line: #1a2740; --line2: #24365a;
  --accent: #3d8bff; --accent2: #5ee1ff; --ok: #4ade9b; --warn: #ffb547; --err: #ff6b7d;
  --f: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --fd: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --tarjeta: linear-gradient(180deg, rgba(16,24,41,.9), rgba(11,17,30,.92));
}
:root[data-tema="claro"] {
  color-scheme: light;
  --bg: #f3f6fb; --bg2: #ffffff; --surface: #ffffff; --surface2: #eef3fb; --raise: #e2eaf8;
  --ink: #0b1527; --muted: #5a6b88; --line: #dce4f0; --line2: #c5d2e6;
  --accent: #2563eb; --accent2: #0377b8; --ok: #15924f; --warn: #c26a00; --err: #d6283f; --tarjeta: #ffffff;
}
* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
select, input[type=text], input[type=number], textarea { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 9px; width: 100%; }
textarea { resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line2); border-radius: 6px; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { padding: 7px 13px; border-radius: 8px; border: 1px solid transparent; background: linear-gradient(180deg, #4a95ff, #2b6fe6); color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: var(--surface2); border-color: var(--line2); color: var(--ink); }
.btn.chico { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.muted { color: var(--muted); }
.etq { font: 600 10.5px var(--mono); letter-spacing: .03em; color: var(--accent2); text-transform: uppercase; margin: 0 0 6px; }
.fila { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.app { display: grid; grid-template-columns: 250px 1fr 300px; height: 100vh; }
aside { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
aside.der { border-right: 0; border-left: 1px solid var(--line); }
.caja { background: var(--tarjeta); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
main { display: flex; flex-direction: column; overflow: hidden; }
.barra { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.barra .sep { width: 1px; height: 22px; background: var(--line2); margin: 0 4px; }
.lienzo-zona { flex: 1; display: grid; place-items: center; overflow: hidden; padding: 14px;
  background: repeating-conic-gradient(var(--surface2) 0 25%, var(--bg) 0 50%) 0 0/24px 24px; }
#lienzo { height: 100%; max-height: calc(100vh - 140px); aspect-ratio: 1080/1350; max-width: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.45); touch-action: none; cursor: default; background: #fff; }
.tira { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surface); overflow-x: auto; align-items: center; }
.mini { position: relative; flex: none; border: 2px solid transparent; border-radius: 7px; padding: 0; background: none; cursor: pointer; line-height: 0; }
.mini canvas { width: 64px; height: 80px; border-radius: 5px; }
.mini.activa { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,139,255,.25); }
.mini span { position: absolute; left: 4px; top: 3px; font: 700 10px var(--mono); color: #fff; text-shadow: 0 1px 3px #000; line-height: 1; }
.lista-c button { display: block; width: 100%; text-align: left; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; }
.lista-c button:hover { background: var(--surface2); }
.lista-c button.activa { background: var(--raise); border-color: var(--line2); }
.lista-c small { display: block; color: var(--muted); }
.fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.foto { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line2); cursor: pointer; padding: 0;
  background: repeating-conic-gradient(#d9dee8 0 25%, #fff 0 50%) 0 0/12px 12px; }
.foto img { width: 100%; height: 100%; object-fit: contain; display: block; }
.foto .tijera { position: absolute; right: 3px; bottom: 3px; border: 0; border-radius: 6px; background: rgba(4,6,11,.8); color: #fff; font-size: 11px; padding: 2px 5px; cursor: pointer; }
.foto.recortada::after { content: "sin fondo"; position: absolute; left: 3px; top: 3px; font: 600 9px var(--mono); background: var(--ok); color: #04210f; border-radius: 4px; padding: 1px 4px; }
.soltar { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted); cursor: pointer; }
.soltar.encima { border-color: var(--accent); color: var(--ink); background: rgba(61,139,255,.08); }
.colores { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.color { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line2); cursor: pointer; padding: 0; }
.color.activo { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(61,139,255,.35); }
.prop { display: grid; gap: 5px; margin-bottom: 10px; }
.prop label { font-weight: 600; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.menu { position: relative; }
.menu .lista { position: absolute; top: 100%; left: 0; z-index: 10; margin-top: 4px; background: var(--surface); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.menu .lista button { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); cursor: pointer; padding: 4px; }
.menu .lista button:hover { border-color: var(--accent); }
.menu .lista canvas { width: 100%; height: 100%; }
.aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50; max-width: 80vw; }
.aviso.err { border-color: var(--err); }
.guion-l { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.guion-l b { display: block; }
.guion-l code { display: block; font: 11px var(--mono); color: var(--muted); white-space: pre-wrap; margin: 4px 0; max-height: 70px; overflow: auto; }
.vacio { padding: 40px; text-align: center; color: var(--muted); }
</style>

<body>
<div class="app">
  <aside>
    <div>
      <p class="etq">Carruseles de la sesión</p>

  <main>
    <div class="barra" id="barra">
      <button class="btn sec chico" id="btnTexto" title="Agregar un texto">T  Texto</button>
      <div class="menu">

  </main>

  <aside class="der">
    <div class="caja" id="props"></div>

      <div class="prop"><label>Idea o enfoque</label><textarea id="clIdea" rows="2" placeholder="Ej.: las señales de picazón que no son pulgas"></textarea></div>
      <div class="fila">

        <select id="clEstilo" style="width:auto"><option value="">Estilo</option><option value="A">A · Nariz a cámara</option><option value="B">B · Color sólido</option><option value="C">C · Metáfora</option><option value="D">D · Garabatos</option><option value="E">E · Lifestyle</option></select>
        <button class="btn chico" id="btnClaude">Escribir</button>

    </div>

<div class="aviso" id="aviso" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const W = 1080, H = 1350;
const PALETA = ["#253C61", "#99D3DA", "#EA8C43", "#F2F2F2", "#FFFFFF", "#1B2C48", "#A8530F", "#111111"];
const FUENTES = { Bebas: '"Bebas"', "DM Sans": '"DM Sans"', "Archivo Black": '"Archivo Black"', Lilita: '"Lilita"', Anton: '"Anton"' };

// ---------- Garabatos y formas (dibujados en una caja de 100×100) ----------
const GARABATOS = {
  rayas: "M22 52 L4 46 M26 30 L10 16 M44 20 L40 2",
  rayas2: "M78 52 L96 46 M74 30 L90 16 M56 20 L60 2",
  flecha: "M10 82 Q 30 25 82 30 M66 16 L84 30 L68 46",
  pregunta: "M24 32 Q24 10 44 10 Q64 10 64 30 Q64 44 46 50 L46 64 M46 82 L46 84 M82 14 L80 62 M80 80 L80 82",
  corazon: "M50 86 C 12 62 6 34 24 22 C 38 13 50 24 50 34 C 50 24 62 13 76 22 C 94 34 88 62 50 86 Z",
  estrella: "M50 6 Q55 45 94 50 Q55 55 50 94 Q45 55 6 50 Q45 45 50 6 Z",
  circulo: "M14 52 C12 20 86 14 88 46 C90 80 24 90 13 58 C8 40 30 20 58 18",
  subrayado: "M4 62 Q28 44 52 58 T 98 50",
  chispas: "M50 4 L50 30 M18 18 L32 38 M82 18 L68 38",
  rizo: "M6 60 C 16 26 40 26 40 50 C 40 72 18 66 24 50 C 30 32 62 32 70 54 C 78 74 96 60 96 42",
  check: "M10 54 L38 82 L92 18",
  equis: "M14 14 L86 86 M86 14 L14 86",
};
const FORMAS = ["circulo", "pastilla", "cuadro", "huella", "manchon"];

// ---------- Estado ----------
let lista = [], marca = [], C = null, cid = null, imgs = [], actual = 0, sel = null, historia = [], recortador = {};
const cache = new Map();
function imagen(src) {
  const url = src.tipo === "marca" ? `/carrusel_marca/${encodeURIComponent(src.f)}` : `/carrusel_img?id=${encodeURIComponent(cid)}&f=${encodeURIComponent(src.f)}`;
  if (!cache.has(url)) {
    const im = new Image();
    im.onload = () => { pintar(); pintarTira(); };
    im.src = url;
    cache.set(url, im);
  }
  const im = cache.get(url);
  return im.complete && im.naturalWidth ? im : null;
}
const L = () => C.laminas[actual];
const nuevoId = () => Math.random().toString(36).slice(2, 9);

function avisar(t, tipo) {
  const a = $("aviso"); a.textContent = t; a.className = "aviso " + (tipo || ""); a.hidden = false;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => a.hidden = true, tipo === "err" ? 7000 : 3500);
}
async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
  const d = await r.json();
  if (d.ok === false) throw new Error(d.error || "Error");
  return d;
}

// ---------- Dibujar ----------
function partir(ctx, texto, ancho) {
  const lineas = [];
  for (const parrafo of texto.split("\n")) {
    let linea = "";
    for (const p of parrafo.split(" ")) {
      const prueba = linea ? linea + " " + p : p;
      if (linea && ctx.measureText(prueba.replace(/\*/g, "")).width > ancho) { lineas.push(linea); linea = p; }
      else linea = prueba;
    }
    lineas.push(linea);
  }
  return lineas;
}
function fuenteDe(c) {
  const peso = c.fuente === "DM Sans" ? (c.peso || 700) : 400;
  return `${peso} ${c.tam}px ${FUENTES[c.fuente] || FUENTES.Bebas}`;
}
function tramos(linea, on = false) {  // «*palabra*» va con el color de acento (puede seguir en la línea de abajo)
  const out = [], partes = linea.split("*");
  partes.forEach((parte, i) => { if (parte) out.push({ t: parte, acento: on }); if (i < partes.length - 1) on = !on; });
  out.fin = on;
  return out;
}
function cajaRedonda(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, h / 2, w / 2)); ctx.fill();
}
function dibujarTexto(ctx, c) {
  const texto = c.mayus ? c.texto.toUpperCase() : c.texto;
  ctx.font = fuenteDe(c);
  ctx.textBaseline = "middle";
  if ("letterSpacing" in ctx) ctx.letterSpacing = (c.espaciado || 0) + "px";
  if (c.curva) {  // una sola línea en arco (radio = curva; negativo = hacia abajo)
    const plano = texto.replace(/\*/g, "").replace(/\n/g, " ");
    const r = Math.abs(c.curva), signo = Math.sign(c.curva);
    const anchos = [...plano].map(ch => ctx.measureText(ch).width);
    const total = anchos.reduce((a, b) => a + b, 0);
    let ang = -total / r / 2;
    ctx.fillStyle = c.color; ctx.textAlign = "center";
    [...plano].forEach((ch, i) => {
      const a = ang + anchos[i] / r / 2;
      ctx.save(); ctx.rotate(a * signo); ctx.translate(0, -r * signo); ctx.fillText(ch, 0, 0); ctx.restore();
      ang += anchos[i] / r;
    });
    c._b = { w: total * 0.9 + c.tam, h: c.tam * 1.6 + total * total / (8 * r) };
    c._dy = -signo * (total * total / (16 * r));
    return;
  }
  const lineas = partir(ctx, texto, c.ancho || 900);
  const alto = c.tam * (c.interlineado || 1.05);
  const altoTotal = alto * lineas.length;
  let anchoMax = 0;
  ctx.textAlign = "left";
  let enAcento = false;
  const pad = c.fondoAcento ? c.tam * 0.14 : 0;
  lineas.forEach((linea, i) => {
    const ts = tramos(linea, enAcento);
    enAcento = ts.fin;
    // la caja de la palabra resaltada lleva aire a los lados para no chocar con lo de al lado
    const anchos = ts.map(t => ctx.measureText(t.t).width + (t.acento && pad ? pad * 2 : 0));
    const total = anchos.reduce((a, b) => a + b, 0);
    anchoMax = Math.max(anchoMax, total);
    const y = -altoTotal / 2 + alto * (i + 0.5);
    let x = c.alinear === "left" ? -(c.ancho || 900) / 2 : c.alinear === "right" ? (c.ancho || 900) / 2 - total : -total / 2;
    if (c.pastilla) {
      ctx.fillStyle = c.pastilla;
      const p = c.tam * 0.28;
      cajaRedonda(ctx, x - p, y - alto / 2 + 2, total + p * 2, alto - 4, c.tam * 0.22);
    }
    ts.forEach((t, k) => {
      const caja = t.acento && pad, tx = x + (caja ? pad : 0);
      if (caja) {
        ctx.fillStyle = c.fondoAcento;
        cajaRedonda(ctx, x + pad * 0.3, y - c.tam * 0.52, anchos[k] - pad * 0.6, c.tam * 1.0, c.tam * 0.16);
      }
      ctx.fillStyle = t.acento ? (c.acento || c.color) : c.color;
      if (c.contorno) { ctx.lineWidth = c.contorno; ctx.strokeStyle = c.colorContorno || "#253C61"; ctx.lineJoin = "round"; ctx.strokeText(t.t, tx, y + c.tam * 0.04); }
      ctx.fillText(t.t, tx, y + c.tam * 0.04);
      x += anchos[k];
    });
  });
  c._b = { w: (c.alinear && c.alinear !== "center" ? (c.ancho || 900) : anchoMax) + c.tam * 0.6, h: altoTotal + c.tam * 0.2 };
  c._dy = 0;
}
function dibujarGarabato(ctx, c) {
  const k = c.w / 100;
  ctx.scale(k, k);
  ctx.translate(-50, -50);
  ctx.strokeStyle = c.color; ctx.lineWidth = (c.grosor || 7) / k; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const p = new Path2D(GARABATOS[c.forma] || GARABATOS.rayas);
  if (c.relleno) { ctx.fillStyle = c.color; ctx.fill(p); } else ctx.stroke(p);
  c._b = { w: c.w, h: c.w };
}
function dibujarForma(ctx, c) {
  ctx.fillStyle = c.color;
  const w = c.w, h = c.h || c.w;
  if (c.forma === "circulo") { ctx.beginPath(); ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill(); }
  else if (c.forma === "pastilla") cajaRedonda(ctx, -w / 2, -h / 2, w, h, h / 2);
  else if (c.forma === "cuadro") cajaRedonda(ctx, -w / 2, -h / 2, w, h, c.radio ?? 24);
  else if (c.forma === "manchon") {
    ctx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const a = i / 64 * Math.PI * 2, r = 0.5 + 0.06 * Math.sin(a * 3 + 1) + 0.04 * Math.cos(a * 5);
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * w * r, Math.sin(a) * h * r);
    }
    ctx.fill();
  } else if (c.forma === "huella") {
    const e = (x, y, rx, ry, rot) => { ctx.beginPath(); ctx.ellipse(x * w, y * w, rx * w, ry * w, rot, 0, Math.PI * 2); ctx.fill(); };
    e(0, 0.14, 0.24, 0.2, 0); e(-0.3, -0.12, 0.09, 0.12, -0.4); e(-0.11, -0.3, 0.09, 0.13, -0.1); e(0.11, -0.3, 0.09, 0.13, 0.1); e(0.3, -0.12, 0.09, 0.12, 0.4);
  }
  c._b = { w, h };
}
function dibujarImagen(ctx, c) {
  const im = imagen(c.src);
  const h = im ? c.w * im.naturalHeight / im.naturalWidth : c.w;
  c._b = { w: c.w, h };
  if (!im) { ctx.fillStyle = "rgba(127,127,127,.25)"; ctx.fillRect(-c.w / 2, -h / 2, c.w, h); return; }
  if (c.voltear) ctx.scale(-1, 1);
  if (c.sombra) { ctx.shadowColor = `rgba(0,0,0,${0.35 * c.sombra})`; ctx.shadowBlur = 50 * c.sombra; ctx.shadowOffsetY = 24 * c.sombra; }
  ctx.drawImage(im, -c.w / 2, -h / 2, c.w, h);
}
function dibujarFondo(ctx, f) {
  if (f.tipo === "degradado") {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, f.color); g.addColorStop(1, f.color2 || "#FFFFFF");
    ctx.fillStyle = g;
  } else ctx.fillStyle = f.color || "#FFFFFF";
  ctx.fillRect(0, 0, W, H);
  if (f.tipo === "imagen" && f.src) {
    const im = imagen(f.src);
    if (im) {  // cubre toda la lámina; zoom y posición del encuadre
      const z = Math.max(W / im.naturalWidth, H / im.naturalHeight) * (f.zoom || 1);
      const w = im.naturalWidth * z, h = im.naturalHeight * z;

function dibujarLamina(ctx, lam, conSeleccion) {

      const { w, h } = c._b;

  dibujarLamina(ctx, L(), true);
}

// ---------- Historia y guardado ----------
function limpio(obj) { return JSON.parse(JSON.stringify(obj, (k, v) => k.startsWith("_") ? undefined : v)); }
function recordar() { historia.push(JSON.stringify(limpio(C))); if (historia.length > 60) historia.shift(); }
function deshacer() {
  if (!historia.length) return;
  C = JSON.parse(historia.pop()); actual = Math.min(actual, C.laminas.length - 1); sel = null;
  todo(); guardarLuego();
}
let tGuardar;
function guardarLuego() {
  $("guardado").textContent = "Guardando…";
  clearTimeout(tGuardar);
  tGuardar = setTimeout(async () => {
    try { C.copy = $("copy").value; await api("/api/carrusel", { id: cid, datos: limpio(C) }); $("guardado").textContent = "Guardado"; }
    catch (e) { $("guardado").textContent = ""; avisar("No se guardó: " + e.message, "err"); }
  }, 600);
}
function cambio(fn, sinHistoria) { if (!sinHistoria) recordar(); fn(); pintar(); pintarTira(); guardarLuego(); }
function todo() { pintar(); pintarTira(); pintarProps(); pintarLista(); pintarFotos(); $("copy").value = C?.copy || ""; pintarGuion(); }

function agregar(capa) {

  pintarProps();
}
function agregarTexto() {
  const claro = ["#253C61", "#1B2C48", "#111111"].includes((L().fondo.color || "").toUpperCase());
  agregar({ tipo: "texto", texto: "Escribe *aquí*", fuente: "Bebas", tam: 120, mayus: true, x: W / 2, y: 260, ancho: 900,
            color: claro ? "#FFFFFF" : "#253C61", acento: claro ? "#99D3DA" : "#EA8C43", alinear: "center", espaciado: 2 });
}
function agregarFoto(src) {
  if (L().fondo.tipo === "imagen" && !sel) { cambio(() => L().fondo.src = src); pintarProps(); return; }
  const capa = L().capas.find(x => x.id === sel);

  agregar({ tipo: "imagen", src, x: W / 2, y: H * 0.62, w: src.tipo === "marca" && /logo/.test(src.f) ? 360 : 760, sombra: src.tipo === "marca" ? 0.6 : 0 });
}

function pintarFotos() {

  $("fotos").innerHTML = C ? (imgs.map(f => `<button class="foto ${sinFondo.has(f) ? "recortada" : ""}" data-foto="${esc(f)}" title="${esc(f)}">
      <img src="/carrusel_img?id=${encodeURIComponent(cid)}&f=${encodeURIComponent(f)}" alt="">
      ${sinFondo.has(f) ? "" : `<span class="tijera" data-recortar="${esc(f)}" title="Quitar fondo">✂</span>`}</button>`).join("")
      || `<p class="muted" style="grid-column:1/-1">Aún no hay fotos.</p>`) : "";
  $("marca").innerHTML = marca.map(f => `<button class="foto" data-marca="${esc(f)}" title="${esc(f)}"><img src="/carrusel_marca/${encodeURIComponent(f)}" alt=""></button>`).join("");
}
async function subirFotos(archivos) {
  if (!C) return avisar("Primero crea o elige un carrusel", "err");
  for (const a of archivos) {
    const r = await fetch(`/api/carrusel_imagen?id=${encodeURIComponent(cid)}&nombre=${encodeURIComponent(a.name)}`, { method: "POST", body: a });
    const d = await r.json();
    if (d.ok === false) avisar(d.error, "err"); else imgs.push(d.archivo);
  }
  pintarFotos();
  avisar(`${archivos.length} foto(s) agregada(s)`);
}
async function quitarFondo(nombre) {
  avisar("Quitando el fondo… (la primera vez tarda un poco más)");
  const im = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = `/carrusel_img?id=${encodeURIComponent(cid)}&f=${encodeURIComponent(nombre)}`; });
  const LADO = 1024, cv = document.createElement("canvas"); cv.width = cv.height = LADO;
  const cx = cv.getContext("2d"); cx.drawImage(im, 0, 0, LADO, LADO);
  const px = cx.getImageData(0, 0, LADO, LADO).data, rgb = new Uint8Array(LADO * LADO * 3);
  for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
  let r;
  for (;;) {
    r = await fetch("/api/carrusel_mascara", { method: "POST", body: rgb });
    if (r.status !== 202) break;
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    avisar(`Bajando el recortador (170 MB, solo la primera vez): ${d.avance || 0} %`);
    await new Promise(ok => setTimeout(ok, 2000));
  }
  if (!r.ok) throw new Error((await r.json()).error);
  const m = new Uint8Array(await r.arrayBuffer());
  const mc = document.createElement("canvas"); mc.width = mc.height = LADO;
  const md = mc.getContext("2d").createImageData(LADO, LADO);
  for (let i = 0; i < m.length; i++) { md.data[i * 4 + 3] = m[i]; }
  mc.getContext("2d").putImageData(md, 0, 0);
  const out = document.createElement("canvas"); out.width = im.naturalWidth; out.height = im.naturalHeight;
  const oc = out.getContext("2d");
  oc.drawImage(im, 0, 0);
  oc.globalCompositeOperation = "destination-in";
  oc.drawImage(mc, 0, 0, out.width, out.height);
  // se recorta al borde de la mascota para que sea fácil de ubicar
  const a = oc.getImageData(0, 0, out.width, out.height).data;
  let x0 = out.width, y0 = out.height, x1 = 0, y1 = 0;
  for (let y = 0; y < out.height; y += 2) for (let x = 0; x < out.width; x += 2) {
    if (a[(y * out.width + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 <= x0) throw new Error("No encontré nada que recortar en esa foto");
  const fin = document.createElement("canvas"); fin.width = x1 - x0 + 3; fin.height = y1 - y0 + 3;
  fin.getContext("2d").drawImage(out, -x0, -y0);
  const blob = await new Promise(ok => fin.toBlob(ok, "image/png"));
  const tallo = nombre.replace(/\.[^.]+$/, "");
  const s = await (await fetch(`/api/carrusel_imagen?id=${encodeURIComponent(cid)}&nombre=${encodeURIComponent(tallo + "_sinfondo.png")}`, { method: "POST", body: blob })).json();
  if (s.ok === false) throw new Error(s.error);
  imgs.push(s.archivo);
  // si la foto ya estaba en la lámina, se cambia por la recortada
  let usada = false;
  cambio(() => C.laminas.forEach(l => l.capas.forEach(c => { if (c.tipo === "imagen" && c.src.tipo === "img" && c.src.f === nombre) { c.src = { tipo: "img", f: s.archivo }; usada = true; } })));
  pintarFotos(); pintarProps();
  avisar(usada ? "Listo: fondo quitado y cambiado en la lámina" : "Listo: toca la foto «sin fondo» para ponerla");
}

                    color: oscuro ? "#FFFFFF" : "#253C61", acento: oscuro ? "#99D3DA" : "#FFFFFF", fondoAcento: oscuro ? null : "#253C61", alinear: "center" });
    if (l.texto) pon("texto", { tipo: "texto", fuente: "DM Sans", peso: 700, tam: 44, x: W / 2, y: i === 0 ? 470 : 420, ancho: 860, interlineado: 1.3, color: oscuro ? "#FFFFFF" : "#253C61", acento: "#EA8C43", alinear: "center" });
  }));

// ---------- Mouse sobre el lienzo ----------
function punto(e) {
  const r = $("lienzo").getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function local(c, p) {
  const a = -(c.rot || 0) * Math.PI / 180, dx = p.x - c.x, dy = p.y - (c.y + (c._dy || 0));
  return { x: dx * Math.cos(a) - dy * Math.sin(a), y: dx * Math.sin(a) + dy * Math.cos(a) };
}
let arrastre = null;
$("lienzo").addEventListener("pointerdown", e => {
  if (!C) return;
  const p = punto(e);
  const actualSel = L().capas.find(x => x.id === sel);
  if (actualSel?._b) {  // ¿tocó un punto de la selección?
    const q = local(actualSel, p), { w, h } = actualSel._b;
    if (Math.hypot(q.x - w / 2, q.y - h / 2) < 34) { recordar(); arrastre = { modo: "tam", c: actualSel, d0: Math.hypot(p.x - actualSel.x, p.y - actualSel.y), base: { w: actualSel.w, h: actualSel.h, tam: actualSel.tam } }; }
    else if (Math.hypot(q.x, q.y + h / 2 + 50) < 34) { recordar(); arrastre = { modo: "girar", c: actualSel }; }
  }
  if (!arrastre) {
    const c = [...L().capas].reverse().find(c => { if (!c._b || c.oculta) return false; const q = local(c, p); return Math.abs(q.x) <= c._b.w / 2 && Math.abs(q.y) <= c._b.h / 2; });
    sel = c ? c.id : null;
    if (c) { recordar(); arrastre = { modo: "mover", c, dx: p.x - c.x, dy: p.y - c.y }; }
    pintarProps();
  }
  $("lienzo").setPointerCapture(e.pointerId); $("lienzo").focus(); pintar();
});
$("lienzo").addEventListener("pointermove", e => {
  const p = punto(e);
  if (!arrastre) {
    const c = C && L().capas.find(x => x.id === sel);
    let cursor = "default";
    if (c?._b) { const q = local(c, p); if (Math.hypot(q.x - c._b.w / 2, q.y - c._b.h / 2) < 34) cursor = "nwse-resize"; else if (Math.hypot(q.x, q.y + c._b.h / 2 + 50) < 34) cursor = "grab"; else if (Math.abs(q.x) <= c._b.w / 2 && Math.abs(q.y) <= c._b.h / 2) cursor = "move"; }
    $("lienzo").style.cursor = cursor; return;
  }
  const c = arrastre.c;
  if (arrastre.modo === "mover") { c.x = Math.round(p.x - arrastre.dx); c.y = Math.round(p.y - arrastre.dy); }
  else if (arrastre.modo === "tam") {
    const k = Math.max(0.1, Math.hypot(p.x - c.x, p.y - c.y) / Math.max(arrastre.d0, 1));
    if (c.tipo === "texto") c.tam = Math.round(Math.max(14, arrastre.base.tam * k));
    else { c.w = Math.round(Math.max(20, arrastre.base.w * k)); if (arrastre.base.h) c.h = Math.round(arrastre.base.h * k); }
  } else if (arrastre.modo === "girar") {
    let a = Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI + 90;
    if (a > 180) a -= 360;
    if (Math.abs(a) < 4) a = 0;
    c.rot = Math.round(a);
  }
  pintar();
});
$("lienzo").addEventListener("pointerup", () => { if (arrastre) { arrastre = null; pintarTira(); pintarProps(); guardarLuego(); } });

document.addEventListener("keydown", e => {
  if (!C || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return deshacer(); }
  const c = L().capas.find(x => x.id === sel);
  if (!c) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); cambio(() => { L().capas = L().capas.filter(x => x !== c); sel = null; }); pintarProps(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") { e.preventDefault(); accion("duplicar"); }
  else if (e.key.startsWith("Arrow")) {
    e.preventDefault(); const d = e.shiftKey ? 20 : 2;
    cambio(() => { if (e.key === "ArrowLeft") c.x -= d; if (e.key === "ArrowRight") c.x += d; if (e.key === "ArrowUp") c.y -= d; if (e.key === "ArrowDown") c.y += d; });
  }
});

function accion(a) {
  const capas = L().capas, i = capas.findIndex(x => x.id === sel), c = capas[i];
  if (!c) return;
  if (a === "borrar") cambio(() => { capas.splice(i, 1); sel = null; });
  if (a === "duplicar") { const d = { ...limpio(c), id: nuevoId(), x: c.x + 30, y: c.y + 30 }; delete d.rol; cambio(() => { capas.push(d); sel = d.id; }); }
  if (a === "arriba" && i < capas.length - 1) cambio(() => { capas.splice(i, 1); capas.splice(i + 1, 0, c); });
  if (a === "abajo" && i > 0) cambio(() => { capas.splice(i, 1); capas.splice(i - 1, 0, c); });
  if (a === "recortar") quitarFondo(c.src.f).catch(e => avisar("No pude quitar el fondo: " + e.message, "err"));
  pintarProps();
}

// ---------- Menús de garabatos y formas ----------
function miniaturas() {
  $("listaGarabatos").innerHTML = Object.keys(GARABATOS).map(g => `<button data-garabato="${g}" title="${g}"><canvas width="72" height="72"></canvas></button>`).join("");
  $("listaGarabatos").querySelectorAll("canvas").forEach((cv, i) => {
    const cx = cv.getContext("2d"); cx.translate(36, 36);
    dibujarGarabato(cx, { forma: Object.keys(GARABATOS)[i], w: 60, color: getComputedStyle(document.body).color, grosor: 6, relleno: false });
  });
  $("listaFormas").innerHTML = FORMAS.map(f => `<button data-forma="${f}" title="${f}"><canvas width="72" height="72"></canvas></button>`).join("");
  $("listaFormas").querySelectorAll("canvas").forEach((cv, i) => {
    const cx = cv.getContext("2d"); cx.translate(36, 36);
    dibujarForma(cx, { forma: FORMAS[i], w: 56, h: FORMAS[i] === "pastilla" ? 28 : 56, color: "#EA8C43" });
  });
}
$("fondoColores").innerHTML = PALETA.map(c => `<button class="color" style="background:${c}" data-fondo="${c}" title="${c}"></button>`).join("");

// ---------- Eventos ----------
document.addEventListener("click", async e => {
  const t = e.target;
  if (!t.closest(".menu")) { $("listaGarabatos").hidden = $("listaFormas").hidden = true; }
  const ir = t.closest("[data-c-id]"); if (ir) return abrir(ir.dataset.cId);
  const lam = t.closest("[data-lam]"); if (lam) { actual = +lam.dataset.lam; sel = null; pintar(); pintarTira(); pintarProps(); return; }
  const rec = t.closest("[data-recortar]"); if (rec) { e.stopPropagation(); return quitarFondo(rec.dataset.recortar).catch(er => avisar("No pude quitar el fondo: " + er.message, "err")); }
  const fo = t.closest("[data-foto]"); if (fo && C) return agregarFoto({ tipo: "img", f: fo.dataset.foto });
  const ma = t.closest("[data-marca]"); if (ma && C) return agregarFoto({ tipo: "marca", f: ma.dataset.marca });
  const fondo = t.closest("[data-fondo]"); if (fondo && C) { cambio(() => { L().fondo.color = fondo.dataset.fondo; if (L().fondo.tipo === "imagen") L().fondo.tipo = "color"; }); sel = null; return pintarProps(); }
  const ga = t.closest("[data-garabato]"); if (ga && C) { $("listaGarabatos").hidden = true; return agregar({ tipo: "garabato", forma: ga.dataset.garabato, x: W / 2, y: H / 2, w: 220, grosor: 9, color: "#253C61" }); }
  const fm = t.closest("[data-forma]"); if (fm && C) { $("listaFormas").hidden = true; const f = fm.dataset.forma; return agregar({ tipo: "forma", forma: f, x: W / 2, y: H / 2, w: f === "pastilla" ? 520 : 420, h: f === "pastilla" ? 110 : (f === "huella" ? undefined : 420), color: "#EA8C43" }); }
  const col = t.closest("[data-c]"); const grupo = t.closest("[data-colores]");
  if (col && grupo && C) {
    const k = grupo.dataset.colores, v = col.dataset.c;
    const c = L().capas.find(x => x.id === sel);
    cambio(() => { if (k === "fcolor") L().fondo.color = v; else if (k === "fcolor2") L().fondo.color2 = v; else if (c) c[k] = v; });
    return pintarProps();
  }
  const q = t.closest("[data-quitar]"); if (q) { const c = L().capas.find(x => x.id === sel); if (c) cambio(() => c[q.dataset.quitar] = null); return pintarProps(); }
  const ac = t.closest("[data-acc]"); if (ac) return accion(ac.dataset.acc);
  const cp = t.closest("[data-copiar]"); if (cp) { await navigator.clipboard.writeText(C.guion.laminas[+cp.dataset.copiar].flow || ""); return avisar("Prompt copiado: pégalo en Google Flow"); }
  if (t.id === "btnAplicar") return aplicarGuion();
  if (t.id === "btnLamina") { cambio(() => C.laminas.push({ fondo: { tipo: "color", color: L().fondo.color || "#99D3DA" }, capas: [] })); actual = C.laminas.length - 1; sel = null; return todo(); }
  if (t.id === "btnDuplicarL") { cambio(() => { const d = limpio(L()); d.capas.forEach(c => c.id = nuevoId()); C.laminas.splice(actual + 1, 0, d); }); actual++; return todo(); }
  if (t.id === "btnBorrarL") { if (C.laminas.length < 2) return; if (!confirm(`¿Borrar la lámina ${actual + 1}?`)) return; cambio(() => C.laminas.splice(actual, 1)); actual = Math.max(0, actual - 1); sel = null; return todo(); }
  if (t.id === "btnMoverI" && actual > 0) { cambio(() => { const [l] = C.laminas.splice(actual, 1); C.laminas.splice(actual - 1, 0, l); }); actual--; return todo(); }
  if (t.id === "btnMoverD" && actual < C.laminas.length - 1) { cambio(() => { const [l] = C.laminas.splice(actual, 1); C.laminas.splice(actual + 1, 0, l); }); actual++; return todo(); }
});
document.addEventListener("input", e => {
  const t = e.target; if (!C) return;
  const c = L().capas.find(x => x.id === sel);
  if (t.dataset.r) {
    const k = t.dataset.r, v = parseFloat(t.value);
    const f = L().fondo;
    cambio(() => { if (k === "fzoom") f.zoom = v; else if (k === "fdx") f.dx = v; else if (k === "fdy") f.dy = v; else if (c) c[k] = v; }, true);
    t.previousElementSibling.querySelector("span").textContent = Math.round(v * 100) / 100;
  } else if (t.dataset.t && c) {
    cambio(() => c[t.dataset.t] = t.type === "checkbox" ? t.checked : t.value, true);
  } else if (t.dataset.libre) {
    const k = t.dataset.libre;
    cambio(() => { if (k === "fcolor") L().fondo.color = t.value; else if (k === "fcolor2") L().fondo.color2 = t.value; else if (c) c[k] = t.value; }, true);
  } else if (t.dataset.f === "tipo") {
    cambio(() => L().fondo.tipo = t.value); pintarProps();
  } else if (t.id === "copy") guardarLuego();
});
// los deslizadores guardan un paso de «deshacer» al empezar a moverse
document.addEventListener("pointerdown", e => { if (e.target.matches?.("input[type=range], input[type=color]")) recordar(); });
document.addEventListener("focusin", e => { if (e.target.matches?.("textarea[data-t]")) recordar(); });
$("btnTexto").onclick = () => C && agregarTexto();
$("btnGarabato").onclick = () => { $("listaGarabatos").hidden = !$("listaGarabatos").hidden; $("listaFormas").hidden = true; };
$("btnForma").onclick = () => { $("listaFormas").hidden = !$("listaFormas").hidden; $("listaGarabatos").hidden = true; };
$("btnDeshacer").onclick = deshacer;
$("btnExportar").onclick = exportar;
$("btnClaude").onclick = escribirConClaude;
$("btnNuevo").onclick = async () => {
  const titulo = $("nuevoTitulo").value.trim();
  if (!titulo) return $("nuevoTitulo").focus();
  try { const d = await api("/api/carrusel_nuevo", { titulo, laminas: 4 }); $("nuevoTitulo").value = ""; await cargarLista(); await abrir(d.id); }
  catch (e) { avisar(e.message, "err"); }
};
$("archivo").onchange = e => { subirFotos([...e.target.files]); e.target.value = ""; };
const zona = $("soltar");
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); zona.classList.add("encima"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === "drop" || !e.relatedTarget) zona.classList.remove("encima"); }));
document.addEventListener("drop", e => { const fs = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith("image/")); if (fs.length) subirFotos(fs); });
addEventListener("storage", e => { if (e.key === "sala_tema") document.documentElement.dataset.tema = e.newValue; });

// ---------- Inicio ----------
(async () => {
  await Promise.all(['400 40px "Bebas"', '500 40px "DM Sans"', '700 40px "DM Sans"', '900 40px "DM Sans"', '40px "Archivo Black"', '40px "Lilita"', '40px "Anton"']
    .map(f => document.fonts.load(f).catch(() => null)));
  miniaturas();
  try {
    await cargarLista();
    let guardado = null; try { guardado = localStorage.getItem("carrusel_abierto"); } catch (e) {}
    const id = lista.find(c => c.id === guardado)?.id || lista[0]?.id;
    if (id) await abrir(id); else todo();
  } catch (e) { avisar("No pude leer los carruseles: " + e.message, "err"); }
})();
</script>
