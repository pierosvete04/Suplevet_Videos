<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teleprompter Suplevet</title>
<style>
:root { --bg: #000; --ink: #fff; --muted: #8a9aa3; --dicho: #5f6d75; --actual: #99D3DA; --linea: #24333a; --acento: #EA8C43; --f: "Segoe UI", system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f); -webkit-text-size-adjust: 100%; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
header, footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #0b1216; border-bottom: 1px solid var(--linea); }
footer { border-top: 1px solid var(--linea); border-bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
button, select { font: 600 15px var(--f); color: var(--ink); background: #16232a; border: 1px solid #2c3f48; border-radius: 10px; padding: 10px 14px; min-height: 44px; }
button[aria-pressed="true"] { background: var(--actual); color: #10252c; border-color: var(--actual); }
button.grande { background: var(--acento); border-color: var(--acento); color: #1d1004; }
label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
input[type=range] { width: 110px; }
#titulo { font-weight: 700; margin-right: auto; }
#estado { color: var(--muted); font-size: 14px; }
#escena { min-height: 0; overflow-y: auto; padding: 30vh 6vw 60vh; }
#escena.espejo { transform: scaleX(-1); }
.pieza { margin: 0 0 2.2em; }
.pieza h2 { font-size: .38em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4em; display: flex; gap: .6em; align-items: center; }
.pieza h2 .hecho { color: var(--actual); }
.pieza p { margin: 0; line-height: 1.3; font-weight: 700; }
.pieza.otra p { color: #4c5a61; }
.w { transition: color .15s; }
.w.dicho { color: var(--dicho); }
.w.actual { color: var(--actual); }
.parte { display: inline; }
.parte + .parte::before { content: " ⏎ "; color: var(--acento); font-size: .6em; vertical-align: middle; }
header, footer { position: relative; z-index: 3; }
.velo { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2; display: none; }
.velo.arriba { top: 0; background: linear-gradient(to bottom, #000 calc(100% - 18px), rgba(0,0,0,.0)); }
.velo.abajo { bottom: 0; background: linear-gradient(to top, #000 calc(100% - 18px), rgba(0,0,0,.0)); }
body.pocas .velo { display: block; } body.pocas #guia { display: none; }
#guia { position: fixed; left: 0; right: 0; top: 34vh; border-top: 2px dashed rgba(234,140,67,.35); pointer-events: none; }
#aviso { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #16232a; border: 1px solid #2c3f48; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; display: none; }
.pin { display: grid; place-items: center; height: 100vh; }
.pin form { display: grid; gap: 10px; width: min(320px, 90vw); }
.pin input { font: 700 28px var(--f); text-align: center; padding: 12px; border-radius: 12px; border: 1px solid #2c3f48; background: #16232a; color: var(--ink); letter-spacing: .3em; }
@media (max-width: 700px) { header label.opc { display: none; } }
</style>
</head>
<body>
<header>
  <span id="titulo">Teleprompter</span>
  <select id="sesion" aria-label="Sesión"></select>
  <select id="filtro" aria-label="Qué mostrar">
    <option value="todo">Todo en orden de grabación</option>
    <option value="cuerpo">Solo cuerpos</option>
    <option value="hook">Solo hooks</option>
    <option value="cta">Solo CTAs</option>
  </select>
  <label class="opc">Tamaño <input type="range" id="tam" min="28" max="140" value="56"></label>
  <label>Líneas <select id="lineas" title="En la tablet: solo se ven 2 o 3 líneas, a la altura de la cámara">
    <option value="0">Todas</option><option value="2">2</option><option value="3">3</option></select></label>
  <button id="espejo" aria-pressed="false" title="Para vidrio de teleprompter">Espejo</button>
</header>
<main id="escena" aria-live="polite"></main>
<div id="guia" aria-hidden="true"></div>
<div class="velo arriba" id="veloA" aria-hidden="true"></div><div class="velo abajo" id="veloB" aria-hidden="true"></div>
<footer>
  <button id="voz" class="grande" aria-pressed="false">🎙 Seguir mi voz</button>
  <button id="auto" aria-pressed="false">▶ Desplazar solo</button>
  <label>Velocidad <input type="range" id="vel" min="10" max="140" value="45"></label>
  <button id="anterior">◀ Anterior</button>
  <button id="siguiente">Siguiente ▶</button>
  <button id="hecha">✓ Toma buena</button>
  <span id="estado"></span>
</footer>
<div id="aviso" role="status"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = w => w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ]/g, "");
const guardar = (k, v) => { try { localStorage.setItem("tp_" + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem("tp_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const API = window.TELEPROMPTER_API || "/api/teleprompter";
let datos = null, piezas = [], actual = 0, palabraActual = 0, rec = null, escuchando = false, autoTimer = null;

function avisar(t, ms = 3500) { const a = $("aviso"); a.textContent = t; a.style.display = "block"; clearTimeout(a._t); a._t = setTimeout(() => a.style.display = "none", ms); }

async function cargar(sesion) {
  const r = await fetch(API + (sesion ? "?sesion=" + encodeURIComponent(sesion) : ""), { credentials: "same-origin" });
  if (r.status === 401) return pedirPin();
  datos = await r.json();
  $("sesion").innerHTML = (datos.sesiones || []).map(s => `<option ${s === datos.sesion ? "selected" : ""}>${esc(s)}</option>`).join("");
  $("titulo").textContent = datos.sesion || "Teleprompter";
  pintar();
}

function pintar() {
  const f = $("filtro").value;
  const hechas = leer("hechas_" + datos.sesion, {});
  piezas = (datos.piezas || []).filter(p => f === "todo" || p.tipo === f);
  $("escena").innerHTML = piezas.length ? piezas.map((p, i) => {
    let n = 0;
    const partes = (p.partes && p.partes.length ? p.partes : [p.texto]).map(t =>
      `<span class="parte">${t.split(/\s+/).filter(Boolean).map(w => `<span class="w" data-i="${n++}">${esc(w)}</span>`).join(" ")}</span>`).join("");
    return `<section class="pieza" id="p${i}" data-i="${i}"><h2>${esc(p.nombre)} · ${esc(p.tipo)}${p.tipo_hook ? " · " + esc(p.tipo_hook) : ""} ${hechas[p.nombre] ? '<span class="hecho">✓ toma buena</span>' : ""}</h2><p>${partes}</p></section>`;
  }).join("") : `<p style="font-size:.5em;color:var(--muted)">Esta sesión no tiene guion todavía. Pídele a Claude el guion de la sesión.</p>`;
  irA(Math.min(actual, Math.max(0, piezas.length - 1)), false);
}

function irA(i, scroll = true) {
  actual = Math.max(0, Math.min(i, piezas.length - 1));
  palabraActual = 0;
  cortarOido();  // lo que dijiste antes de cambiar de pieza no cuenta para la nueva
  document.querySelectorAll(".pieza").forEach(s => s.classList.toggle("otra", Number(s.dataset.i) !== actual));
  document.querySelectorAll(`#p${actual} .w`).forEach(w => w.classList.remove("dicho", "actual"));
  $("estado").textContent = piezas.length ? `${actual + 1} / ${piezas.length}` : "";
  if (scroll) centrar(document.getElementById("p" + actual));
}

// Deja la línea de «el» al 30% de la escena, deslizando suave (nunca de golpe)
let destino = null, deslizando = false;
function centrar(el) {
  if (!el) return;
  const e = $("escena");
  const meta = Math.max(0, Math.round(e.scrollTop + el.getBoundingClientRect().top - e.getBoundingClientRect().top - e.clientHeight * 0.3));
  if (Math.abs(meta - (deslizando ? destino : e.scrollTop)) < 4) return;  // misma línea: no se mueve
  destino = meta;
  if (!deslizando) { deslizando = true; requestAnimationFrame(deslizar); }
}
function deslizar() {
  if (destino === null) { deslizando = false; return; }
  const e = $("escena"), falta = destino - e.scrollTop;
  if (Math.abs(falta) < 1) { e.scrollTop = destino; deslizando = false; return; }
  e.scrollTop += Math.sign(falta) * Math.max(1, Math.abs(falta) * 0.12);
  requestAnimationFrame(deslizar);
}
$("escena").addEventListener("wheel", () => { destino = null; });  // si mueves tú la pantalla, no se pelea contigo
$("escena").addEventListener("touchmove", () => { destino = null; });

// ---------- Seguir la voz ----------
// [seguidor] Ubica lo que vas diciendo comparando tus últimas palabras, EN ORDEN, con el guion cercano.
// Solo avanza, prefiere la coincidencia más cercana y pide más pruebas cuanto más lejos tendría que saltar.
const NUMEROS = { 0: "cero", 1: "uno", 2: "dos", 3: "tres", 4: "cuatro", 5: "cinco", 6: "seis", 7: "siete", 8: "ocho", 9: "nueve", 10: "diez", 12: "doce", 15: "quince", 20: "veinte", 30: "treinta", 50: "cincuenta", 100: "cien" };
const VACIAS = new Set("a al con de del el en es la las le les lo los me mi mis no o para por que se si su sus te tu tus un una uno unos y ya yo eso esta este esto muy mas pero como".split(" "));
const clave = w => { const n = norm(w); return NUMEROS[n] || (n === "un" || n === "una" ? "uno" : n); };
const peso = w => !w ? 0 : VACIAS.has(w) ? 0.35 : 1;

function parecido(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  const [c, l] = a.length <= b.length ? [a, b] : [b, a];
  if (c.length >= 4 && l.startsWith(c) && c.length >= l.length * 0.55) return 0.8;  // palabra a medio reconocer
  if (c.length >= 5 && distancia(a, b) <= (l.length >= 8 ? 2 : 1)) return 0.7;       // una letra mal oída
  return 0;
}
function distancia(a, b) {
  let fila = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    const nueva = [i];
    for (let j = 1; j <= b.length; j++) nueva[j] = Math.min(fila[j] + 1, nueva[j - 1] + 1, fila[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    fila = nueva;
  }
  return fila[b.length];
}

// guion: palabras de la pieza (ya con «clave»); dichas: lo último que oyó el micrófono; pos: palabras ya leídas.
// Devuelve la nueva posición (nunca menor que pos).
function ubicar(guion, dichas, pos) {
  const s = dichas.filter(Boolean).slice(-8), m = s.length;
  if (!m) return pos;
  // Mira también bastante atrás: si repites una frase ya leída (otra toma), encaja ahí y no en su repetición de más adelante
  const lo = Math.max(0, pos - 30), hi = Math.min(guion.length, pos + 16), g = guion.slice(lo, hi), L = g.length;
  // Alineación local: H = mejor puntaje hasta (i, j); M = lo mismo pero terminando en una palabra que coincide
  const H = Array.from({ length: m + 1 }, () => new Array(L + 1).fill(0));
  const M = Array.from({ length: m + 1 }, () => new Array(L + 1).fill(-Infinity));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= L; j++) {
    const p = parecido(s[i - 1], g[j - 1]);
    if (p) M[i][j] = H[i - 1][j - 1] + p * peso(g[j - 1]);
    H[i][j] = Math.max(0, M[i][j], H[i - 1][j - 1] - 0.6, H[i - 1][j] - 0.5, H[i][j - 1] - 0.5);
  }
  // La alineación tiene que terminar en lo último que dijiste (o en la penúltima, por si la última llegó a medias)
  let mejor = null;
  for (let j = 1; j <= L; j++) {
    const puntos = Math.max(M[m][j], m > 1 ? M[m - 1][j] - 0.4 : -Infinity);
    if (puntos <= 0) continue;
    const nueva = lo + j, valor = puntos - 0.12 * Math.max(0, nueva - pos - 2);  // lo lejano necesita más pruebas
    if (!mejor || valor > mejor.valor + 1e-9) mejor = { nueva, puntos, valor };
  }
  if (!mejor || mejor.nueva <= pos) return pos;  // lo que oyó encaja donde ya estás (o atrás): no se mueve
  const salto = mejor.nueva - pos;
  const pide = salto <= 2 ? 0.9 : salto <= 5 ? 1.6 : salto <= 10 ? 2.4 : 3.2;  // ~1, 2, 3 o 4 palabras seguidas
  return mejor.puntos >= pide ? mejor.nueva : pos;
}
// Ya se puede pasar a la siguiente pieza: no queda nada o solo palabras de relleno («y», «de»…)
const piezaLeida = (guion, pos) => guion.slice(pos).every(w => peso(w) < 1);
// [/seguidor]

// Lo oído: palabras de sesiones anteriores del micrófono + la sesión actual, desde el último corte (cambio de pieza)
let oidoAntes = [], oidoSesion = [], corte = 0, finTimer = null;
function cortarOido() { oidoAntes = []; corte = oidoSesion.length; clearTimeout(finTimer); finTimer = null; }
function marcar(hasta) {
  const ws = document.querySelectorAll(`#p${actual} .w`);
  ws.forEach((w, k) => { w.classList.toggle("dicho", k < hasta); w.classList.toggle("actual", k === hasta); });
  centrar(ws[Math.min(hasta, ws.length - 1)]);
  palabraActual = hasta;
}

function avanzarCon() {
  const ws = [...document.querySelectorAll(`#p${actual} .w`)].map(w => clave(w.textContent));
  const nueva = ubicar(ws, oidoAntes.concat(oidoSesion.slice(corte)), palabraActual);
  if (nueva > palabraActual) marcar(nueva);
  if (ws.length && piezaLeida(ws, palabraActual) && !finTimer) {
    const pieza = actual;
    finTimer = setTimeout(() => { finTimer = null; if (actual === pieza && escuchando) { avisar("Pieza terminada"); irA(actual + 1); } }, 1200);
  }
}

function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return avisar("Este navegador no reconoce voz. Usa Chrome en la PC o el teleprompter del panel (https) en el iPad.", 6000);
  if (!window.isSecureContext) return avisar("El micrófono necesita conexión segura (https). Aquí usa «Desplazar solo».", 6000);
  rec = new SR();
  rec.lang = "es-PE"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    // Todo lo oído en esta sesión del micrófono (lo definitivo y lo provisional), en orden
    let t = ""; for (let i = 0; i < e.results.length; i++) t += " " + e.results[i][0].transcript;
    oidoSesion = t.split(/\s+/).map(clave).filter(Boolean);
    if (corte > oidoSesion.length) corte = oidoSesion.length;
    avanzarCon();
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { avisar("Permite el micrófono para seguir tu voz."); pararVoz(); }
    else if (e.error === "audio-capture") avisar("No encuentro el micrófono.");
  };
  rec.onend = () => {
    // El navegador corta el micrófono tras un silencio: se guarda lo último oído y se vuelve a escuchar
    oidoAntes = oidoAntes.concat(oidoSesion.slice(corte)).slice(-8); oidoSesion = []; corte = 0;
    if (escuchando) setTimeout(() => { if (escuchando) try { rec.start(); } catch (e) {} }, 150);
  };
  oidoAntes = []; oidoSesion = []; corte = 0;
  escuchando = true; rec.start();
  $("voz").setAttribute("aria-pressed", "true"); $("voz").textContent = "🎙 Escuchando…";
}
function pararVoz() { escuchando = false; clearTimeout(finTimer); finTimer = null; try { rec && rec.stop(); } catch (e) {} $("voz").setAttribute("aria-pressed", "false"); $("voz").textContent = "🎙 Seguir mi voz"; }

// ---------- Desplazamiento automático ----------
function auto(on) {
  clearInterval(autoTimer);
  $("auto").setAttribute("aria-pressed", String(on));
  $("auto").textContent = on ? "❚❚ Pausar" : "▶ Desplazar solo";
  if (on) autoTimer = setInterval(() => { $("escena").scrollTop += Number($("vel").value) / 30; }, 33);
}

// ---------- PIN (desde la tablet por WiFi) ----------
function pedirPin() {
  document.body.innerHTML = `<div class="pin"><form id="f"><b style="text-align:center">Teleprompter Suplevet</b>
    <span style="color:var(--muted);text-align:center;font-size:14px">Escribe el PIN que aparece en el Estudio Suplevet</span>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
    <button class="grande">Entrar</button><span id="err" style="color:#f07a6a;text-align:center"></span></form></div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const v = document.getElementById("pin").value.trim();
    if (!v) { document.getElementById("err").textContent = "Escribe el PIN."; return; }
    const r = await fetch("/entrar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: v }) });
    if (r.ok) location.reload(); else document.getElementById("err").textContent = "PIN incorrecto.";
  };
}

// ---------- Pocas líneas (tablet): se tapa todo menos una franja de 2 o 3 líneas donde va la palabra actual ----------
function ponerVelos() {
  const n = Number($("lineas").value);
  document.body.classList.toggle("pocas", n > 0);
  if (!n) return;
  const e = $("escena"), r = e.getBoundingClientRect(), lh = parseFloat(e.style.fontSize || 56) * 1.3;
  const arriba = r.top + e.clientHeight * 0.3 - lh * 0.15;  // donde «centrar» deja la línea actual
  $("veloA").style.height = Math.max(0, arriba) + "px";
  $("veloB").style.height = Math.max(0, innerHeight - arriba - lh * (n + .3)) + "px";
}
addEventListener("resize", ponerVelos);

// ---------- Controles ----------
$("tam").oninput = e => { $("escena").style.fontSize = e.target.value + "px"; guardar("tam", e.target.value); ponerVelos(); };
$("lineas").onchange = e => { guardar("lineas", e.target.value); ponerVelos(); const w = document.querySelector(`#p${actual} .w.actual`) || document.getElementById("p" + actual); centrar(w); };
$("espejo").onclick = () => { const on = !$("escena").classList.contains("espejo"); $("escena").classList.toggle("espejo", on); $("espejo").setAttribute("aria-pressed", on); guardar("espejo", on); };
$("voz").onclick = () => escuchando ? pararVoz() : iniciarVoz();
$("auto").onclick = () => auto($("auto").getAttribute("aria-pressed") !== "true");
$("vel").oninput = e => guardar("vel", e.target.value);
$("anterior").onclick = () => irA(actual - 1);
$("siguiente").onclick = () => irA(actual + 1);
$("hecha").onclick = () => { const p = piezas[actual]; if (!p) return; const h = leer("hechas_" + datos.sesion, {}); h[p.nombre] = true; guardar("hechas_" + datos.sesion, h); avisar(`${p.nombre}: toma buena ✓`); pintar(); irA(actual + 1); };
$("filtro").onchange = () => { actual = 0; pintar(); };
$("sesion").onchange = e => { actual = 0; cargar(e.target.value); };
$("escena").addEventListener("click", e => { const s = e.target.closest(".pieza"); if (s && Number(s.dataset.i) !== actual) irA(Number(s.dataset.i)); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") irA(actual + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") irA(actual - 1);
  if (e.key === " ") { e.preventDefault(); auto($("auto").getAttribute("aria-pressed") !== "true"); }
});
$("tam").value = leer("tam", 56); $("escena").style.fontSize = $("tam").value + "px";
$("vel").value = leer("vel", 45);
if (leer("espejo", false)) $("espejo").click();
$("lineas").value = leer("lineas", "0"); ponerVelos();
cargar();
</script>
</body>
</html>
