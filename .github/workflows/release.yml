# Al subir un tag vX.Y.Z arma la sala portable para Windows y publica el release:
#   SalaSuplevet-vX.Y.Z.zip  (todo: .exe + app + ffmpeg)  -> instalación nueva
#   app-vX.Y.Z.zip           (solo el código)              -> lo que baja "Actualizar" en la sala
name: Release sala de edición

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que VERSION coincide con el tag
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}" || { echo "VERSION no coincide con el tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"  # la misma versión con la que se probó el .exe en la PC del dueño

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Armar SalaSuplevet.exe
        shell: bash
        run: |
          set -o pipefail
          # Se arma desde una carpeta que solo tiene el lanzador: si PyInstaller ve motor.py/panel.py
          # los importa, y motor.py se detiene porque el servidor de GitHub no tiene ffmpeg.
          mkdir -p ../_exe && cp lanzador.py instalador/icono.ico ../_exe/ && cd ../_exe
          pyinstaller lanzador.py --icon icono.ico --distpath ../editor/dist --noconfirm --onedir --windowed --name SalaSuplevet             --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime             --collect-all tokenizers --collect-all av --collect-all huggingface_hub --collect-all webview --collect-all clr_loader --collect-all pythonnet 2>&1 | tee ../editor/pyinstaller.log || {
            # El registro de Actions no es público: el error se publica como anotación para poder leerlo.
            # GitHub solo muestra 10 anotaciones por paso: se publica lo que dijo el proceso que falló.
            awk '/failed with:/{n=NR} {l[NR]=$0} END{for(i=n+1;i<=n+12 && i<=NR;i++) print l[i]}' ../editor/pyinstaller.log | grep -v '^\s*$' | head -n 9 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }

      - name: Bajar ffmpeg
        shell: pwsh
        run: |
          # gyan.dev a veces rechaza a los servidores de GitHub: se reintenta y, si no, se baja de su copia en GitHub
          $ok = $false
          foreach ($i in 1..3) {
            try { Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip -TimeoutSec 300; $ok = $true; break }
            catch { Write-Host "gyan.dev falló (intento $i): $_"; Start-Sleep 15 }
          }
          if (-not $ok) {
            $rel = Invoke-RestMethod https://api.github.com/repos/GyanD/codexffmpeg/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
            $url = ($rel.assets | Where-Object { $_.name -like '*essentials_build.zip' } | Select-Object -First 1).browser_download_url
            Write-Host "Bajando ffmpeg de $url"
            Invoke-WebRequest $url -OutFile ffmpeg.zip -TimeoutSec 600
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force dist/SalaSuplevet/ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe,LICENSE | Copy-Item -Destination dist/SalaSuplevet/ffmpeg

      - name: Copiar el código y empaquetar
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $app = "dist/SalaSuplevet/app"
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item *.py,app.html,teleprompter.html,cuenta.js,config.json,VERSION,LANZADOR_MINIMO,LEEME_EDITOR.md,GUIA_SONIDOS.md -Destination $app
          Copy-Item biblioteca -Destination $app -Recurse
          Copy-Item fuentes -Destination $app -Recurse
          Remove-Item "$app/lanzador.py"
          Compress-Archive -Path "$app/*" -DestinationPath "app-$tag.zip"
          Compress-Archive -Path dist/SalaSuplevet -DestinationPath "SalaSuplevet-$tag.zip"
          $min = (Get-Content LANZADOR_MINIMO -Raw).Trim()
          (Get-Content NOTAS_VERSION.md -Raw) + "`n`nlanzador minimo: $min" | Set-Content notas.md -Encoding utf8

      - name: Armar el instalador (.exe)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=$v" "/DOrigen=..\dist\SalaSuplevet" "instalador\SalaSuplevet.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: softprops/action-gh-release@v2
        with:
          # el instalador va primero: las salas viejas abren el primer archivo «SalaSuplevet-…» cuando piden reinstalar
          files: |
            editor/SalaSuplevet-Instalador-${{ github.ref_name }}.exe
            editor/app-${{ github.ref_name }}.zip
            editor/SalaSuplevet-${{ github.ref_name }}.zip
          body_path: editor/notas.md
